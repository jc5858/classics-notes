  Bamboo.installDefs();
  const cells = [...document.querySelectorAll('.cell')];
  cells.forEach(a => { if (a.dataset.todo) a.addEventListener('click', e => { e.preventDefault(); toast('這一頁還沒做'); }); });
  const H = 128;
  // 依格子目前的寬度畫竹簡；版面還沒有寬度時先等一下，寬度改變時重畫
  let lastW = 0;
  function render() {
    const cw = cells[1].querySelector('.host').clientWidth;
    if (cw < 60) { setTimeout(render, 100); return; }
    if (Math.abs(cw - lastW) < 2) return;
    lastW = cw;
    const slipsW = Math.max(40, cw - Bamboo.metrics(H).W - 4);
    cells.forEach((a, i) => {
      Bamboo.bundle(a.querySelector('.host'), { H, slipsWidth: slipsW, reveal: a.dataset.read ? Math.round(slipsW / 3) : 0, title: a.dataset.title, seed: 100 + i * 7, fontSize: 16, clear: true });
    });
  }
  render();
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 200); });
</script><footer class="site-foot">讀書長卷 · 從零開始讀《論語》與《史記》</footer><div class="toast" id="toast" role="status"></div><script>
  window.toast = (function () {
    let tt;
    return function (msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); };
  })();
</script></body></html>
