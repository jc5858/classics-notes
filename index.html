<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>讀書長卷</title><meta name="description" content="從零開始讀《論語》與《史記》的筆記。"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet"><script src="/classics-notes/bamboo.js"></script><link rel="stylesheet" href="/classics-notes/_astro/Base.D8Pnb-8f.css"></head><body><header class="site-head"><a class="site-name" href="/classics-notes/">讀書長卷</a><nav class="site-nav"><a href="/classics-notes/lunyu/">論語</a><a href="/classics-notes/shiji/">史記</a><a href="/classics-notes/about/">關於</a></nav></header><section class="home-intro"><h1>兩卷竹簡，慢慢攤開</h1><p>從零開始讀《論語》與《史記》的筆記。讀過的攤開，沒讀的還捲著。</p></section><main class="home-books"><a class="home-book" href="/classics-notes/lunyu/" data-title="論語" data-read="0" data-total="20" data-seed="11"><div class="host"></div><div class="label-plate"><div class="t">論語</div><div class="m">孔子及其弟子 · 尚未開卷 · 0 / 20 篇</div></div></a><a class="home-book" href="/classics-notes/shiji/" data-title="史記" data-read="0" data-total="130" data-seed="29"><div class="host"></div><div class="label-plate"><div class="t">史記</div><div class="m">司馬遷 · 尚未開卷 · 0 / 130 卷</div></div></a></main><script>
  Bamboo.installDefs();
  let seen = false;
  try { seen = sessionStorage.getItem('home-unrolled') === '1'; } catch (e) {}
  const animate = !seen && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!animate) document.body.classList.add('no-anim');

  // 依目前的版面寬度畫竹簡；寬度改變時重畫。版面還沒有寬度時（例如視窗剛打開）先等一下
  let lastW = 0, first = true;
  function render() {
    const width = document.querySelector('.home-books').clientWidth;
    if (width < 200) { setTimeout(render, 100); return; }
    if (Math.abs(width - lastW) < 2) return;
    lastW = width;
    const play = first && animate;
    if (!play) document.body.classList.add('no-anim');
    document.querySelectorAll('.home-book').forEach(book => {
      const host = book.querySelector('.host');
      const H = innerWidth < 760 ? 140 : 200;
      const rollW = Bamboo.metrics(H).W;
      const full = Math.min(860, host.clientWidth) - rollW;
      const read = +book.dataset.read, total = +book.dataset.total;
      const target = read ? Math.max(full * read / total, 60) : 0;
      const b = Bamboo.bundle(host, { H, slipsWidth: full, reveal: play ? 0 : target, title: book.dataset.title, seed: +book.dataset.seed, fontSize: Math.round(H * 0.11), clear: true });
      if (play) setTimeout(() => b.setReveal(target), 120);
      // 滑鼠移上去：再多攤開一點，暗示可以點進去
      book.onmouseenter = () => { document.body.classList.remove('no-anim'); b.setReveal(target + (H * 0.2)); };
      book.onmouseleave = () => b.setReveal(target);
    });
    if (first) { first = false; try { sessionStorage.setItem('home-unrolled', '1'); } catch (e) {} }
  }
  render();
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 200); });
</script><footer class="site-foot">讀書長卷 · 從零開始讀《論語》與《史記》<small>字型：全字庫正楷體（國家發展委員會，依政府資料開放授權條款第 1 版使用）</small></footer><div class="toast" id="toast" role="status"></div><script>
  window.toast = (function () {
    let tt;
    return function (msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); };
  })();
</script></body></html>
